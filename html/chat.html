<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
    :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --border: #2a2f3a;
        --text: #e6e8ec;
        --text-dim: #8b909c;
        --accent: #5b8def;
        --accent-2: #3f6fd6;
        --danger: #e55a5a;
        --system: #6b7280;
        --radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }

    .app {
        width: 100%;
        max-width: 560px;
        height: min(720px, 92vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.2px;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-dim);
        white-space: nowrap;
    }

    .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        transition: background 0.2s ease;
    }

    .status.connected .dot { background: #4cc38a; }
    .status.connecting .dot { background: #e0a83c; }

    /* --- Join screen --- */
    .join {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 16px;
        text-align: center;
    }

    .join p {
        color: var(--text-dim);
        font-size: 13px;
        margin: 0;
        max-width: 320px;
    }

    .join form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 280px;
    }

    input {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        outline: none;
    }

    input:focus {
        border-color: var(--accent);
    }

    button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        background: var(--accent);
        color: white;
        transition: background 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) { background: var(--accent-2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
        color: var(--danger);
        font-size: 12.5px;
        min-height: 16px;
    }

    /* --- Chat screen --- */
    .chat {
        flex: 1;
        display: none;
        flex-direction: column;
        min-height: 0;
    }

    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .msg {
        max-width: 78%;
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--panel-2);
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        white-space: pre-wrap;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .msg .author {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 2px;
    }

    .msg.own {
        align-self: flex-end;
        background: var(--accent);
        color: white;
        border-bottom-left-radius: 14px;
        border-bottom-right-radius: 4px;
    }

    .msg.own .author { display: none; }

    .msg.system {
        align-self: center;
        background: transparent;
        color: var(--system);
        font-size: 12px;
        font-style: italic;
        padding: 2px 8px;
    }

    .composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
    }

    .composer input {
        flex: 1;
    }

    .composer button {
        padding: 10px 18px;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }
</style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Chat</h1>
            <div id="status" class="status">
                <span class="dot"></span>
                <span id="status-text">Not connected</span>
            </div>
        </header>

        <section id="join" class="join">
            <p>Pick a username to join the chat. Everyone in the room will see your messages.</p>
            <form id="join-form">
                <input id="username" type="text" placeholder="Username" maxlength="32" autocomplete="off" required>
                <button id="join-btn" type="submit">Join Chat</button>
                <div id="join-error" class="error"></div>
            </form>
        </section>

        <section id="chat" class="chat">
            <div id="messages" class="messages"></div>
            <form id="composer" class="composer">
                <input id="input" type="text" placeholder="Message" autocomplete="off">
                <button id="send-btn" type="submit">Send</button>
            </form>
        </section>
    </div>

<script>
(function () {
    const joinScreen   = document.querySelector("#join");
    const joinForm     = document.querySelector("#join-form");
    const joinBtn      = document.querySelector("#join-btn");
    const joinError    = document.querySelector("#join-error");
    const usernameEl   = document.querySelector("#username");

    const chatScreen   = document.querySelector("#chat");
    const messagesEl   = document.querySelector("#messages");
    const composer     = document.querySelector("#composer");
    const input        = document.querySelector("#input");
    const sendBtn      = document.querySelector("#send-btn");

    const statusEl     = document.querySelector("#status");
    const statusText   = document.querySelector("#status-text");

    let socket = null;
    let username = "";

    function setStatus(state, text) {
        statusEl.className = "status" + (state ? " " + state : "");
        statusText.textContent = text;
    }

    function appendMessage(kind, author, text) {
        const el = document.createElement("div");
        el.classList.add("msg", kind);

        if (kind !== "system") {
            const authorEl = document.createElement("span");
            authorEl.className = "author";
            authorEl.textContent = author;
            el.appendChild(authorEl);
        }

        const textEl = document.createElement("span");
        textEl.textContent = text;
        el.appendChild(textEl);

        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Parses the plain-text protocol used by the server:
    //   "<name> joined."   -> system message
    //   "<name> left."     -> system message
    //   "<name>: <text>"   -> chat message from <name>
    function handleServerMessage(raw) {
        if (raw.endsWith(" joined.") || raw.endsWith(" left.")) {
            appendMessage("system", null, raw);
            return;
        }

        const sep = raw.indexOf(": ");
        if (sep === -1) {
            appendMessage("system", null, raw);
            return;
        }

        const name = raw.slice(0, sep);
        const text = raw.slice(sep + 2);
        appendMessage(name === username ? "own" : "other", name, text);
    }

    function wsUrl() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return `${proto}//${location.host}/websocket`;
    }

    function connect(name) {
        setStatus("connecting", "Connecting…");
        joinBtn.disabled = true;
        joinError.textContent = "";

        socket = new WebSocket(wsUrl());
        let joined = false;

        socket.onopen = () => {
            socket.send(name);
        };

        socket.onmessage = (event) => {
            if (!joined) {
                if (event.data === "Username already taken.") {
                    joinError.textContent = "That username is already taken.";
                    setStatus("", "Not connected");
                    joinBtn.disabled = false;
                    socket.close();
                    return;
                }

                joined = true;
                username = name;
                showChat();
            }

            handleServerMessage(event.data);
        };

        socket.onclose = () => {
            setStatus("", "Disconnected");
            joinBtn.disabled = false;
            sendBtn.disabled = true;
            input.disabled = true;

            if (joined) {
                appendMessage("system", null, "Connection closed.");
                joinScreen.style.display = "flex";
                chatScreen.style.display = "none";
            }
        };

        socket.onerror = () => {
            setStatus("", "Connection error");
        };
    }

    function showChat() {
        joinScreen.style.display = "none";
        chatScreen.style.display = "flex";
        setStatus("connected", "Connected as " + username);
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    }

    joinForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = usernameEl.value.trim();
        if (!name) return;
        connect(name);
    });

    composer.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value;
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(text);
        input.value = "";
    });
})();
</script>
</body>
</html>
